# ==============================================================================
# SABIN BALAN FINANCE (GUARDIANTREE FP) — HIGH PERFORMANCE NGINX REVERSE PROXY
# Location: /etc/nginx/sites-available/sabin_finance
# Symlink:  /etc/nginx/sites-enabled/sabin_finance -> /etc/nginx/sites-available/sabin_finance
# ==============================================================================

# Upstream Gunicorn WSGI Application Server Socket
upstream sabin_finance_app {
    server unix:/var/www/sabin_finance/gunicorn.sock fail_timeout=0;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server — Automatic Redirect to Secure HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt ACME Challenge Verification Directory
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server — Production SSL, Caching & Performance Acceleration
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # SSL Certificates (Uncomment after running certbot)
    # ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # SSL Performance Tweaks
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # --------------------------------------------------------------------------
    # GZIP High-Speed Compression Engine
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2
        font/woff
        application/vnd.ms-fontobject;

    # --------------------------------------------------------------------------
    # Security Hardening Headers
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Request Limits & Buffering
    client_max_body_size 50M;
    client_body_buffer_size 128k;
    proxy_read_timeout 120s;
    proxy_connect_timeout 120s;
    proxy_send_timeout 120s;

    # --------------------------------------------------------------------------
    # Static Files Delivery (Static Assets with 1-Year Immutable Caching)
    # --------------------------------------------------------------------------
    location /static/ {
        alias /var/www/sabin_finance/staticfiles/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        log_not_found off;
        tcp_nodelay off;
        open_file_cache max=3000 inactive=120s;
        open_file_cache_valid 45s;
        open_file_cache_min_uses 2;
        open_file_cache_errors off;
    }

    # --------------------------------------------------------------------------
    # Media Files Delivery (User Uploads & Documents with 30-Day Caching)
    # --------------------------------------------------------------------------
    location /media/ {
        alias /var/www/sabin_finance/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        log_not_found off;
    }

    # --------------------------------------------------------------------------
    # Favicon, Robots.txt & LLMs.txt Direct Pass-through
    # --------------------------------------------------------------------------
    location = /favicon.ico {
        alias /var/www/sabin_finance/staticfiles/logo.png;
        access_log off;
        log_not_found off;
        expires 30d;
    }

    location = /robots.txt {
        proxy_pass http://sabin_finance_app;
        proxy_set_header Host $http_host;
        access_log off;
    }

    location = /sitemap.xml {
        proxy_pass http://sabin_finance_app;
        proxy_set_header Host $http_host;
        access_log off;
    }

    location = /llms.txt {
        proxy_pass http://sabin_finance_app;
        proxy_set_header Host $http_host;
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Dynamic Request Proxying to Gunicorn WSGI
    # --------------------------------------------------------------------------
    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_buffer_size 16k;

        if (!-f $request_filename) {
            proxy_pass http://sabin_finance_app;
            break;
        }
    }

    # Custom Error Pages
    error_page 500 502 503 504 /500.html;
    location = /500.html {
        root /var/www/sabin_finance/templates/;
    }
}
